<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 850" width="420" height="850" role="img" aria-labelledby="title desc">
<title id="title">Local and external model data flows</title><desc id="desc">Local: documents to local model to answer within the company environment. External model: selected context is sent to a model provider and an answer returns. Optional integrations can send data outside both setups.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#526575" stroke-width="1.5"/></marker></defs>
<rect width="420" height="850" rx="12" fill="#f4f7fb"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#172c3d"><text x="24" y="38" font-size="23" font-weight="600">Where the answer</text><text x="24" y="65" font-size="23" font-weight="600">is generated</text>
<rect x="20" y="88" width="380" height="318" rx="8" fill="#fff" stroke="#dce4ec"/><text x="40" y="120" font-size="20" font-weight="600">Local model</text><text x="40" y="147" font-size="16" fill="#526575">All inside the company environment</text>
<rect x="55" y="164" width="310" height="52" rx="5" fill="#edf2f7"/><text x="210" y="196" text-anchor="middle" font-size="18">Documents and selected context</text><path d="M210 224V242" stroke="#526575" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="55" y="252" width="310" height="52" rx="5" fill="#2859d9"/><text x="210" y="285" text-anchor="middle" font-size="19" fill="#fff">Local model</text><path d="M210 312V330" stroke="#526575" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="55" y="340" width="310" height="45" rx="5" fill="#edf2f7"/><text x="210" y="369" text-anchor="middle" font-size="18">Your answer</text>
<rect x="20" y="424" width="380" height="285" rx="8" fill="#fff" stroke="#dce4ec"/><text x="40" y="457" font-size="20" font-weight="600">External model</text>
<rect x="55" y="479" width="310" height="58" rx="5" fill="#edf2f7"/><text x="210" y="504" text-anchor="middle" font-size="18">Your documents</text><text x="210" y="526" text-anchor="middle" font-size="15" fill="#526575">Company environment</text>
<path d="M150 545V596" stroke="#2859d9" stroke-width="2" marker-end="url(#arrow)"/><text x="140" y="566" text-anchor="end" font-size="15" fill="#2859d9">Context</text><path d="M270 596V545" stroke="#526575" stroke-width="2" marker-end="url(#arrow)"/><text x="280" y="584" font-size="15" fill="#526575">Answer</text>
<rect x="55" y="610" width="310" height="73" rx="5" fill="#edf2f7" stroke="#526575" stroke-dasharray="6 5"/><text x="210" y="641" text-anchor="middle" font-size="19">Model provider</text><text x="210" y="666" text-anchor="middle" font-size="16" fill="#526575">External service</text>
<text x="24" y="746" font-size="18" font-weight="600">In either setup</text><text x="24" y="775" font-size="17" fill="#526575">Email, CRM and web connections</text><text x="24" y="801" font-size="17" fill="#526575">can send data outside your environment.</text><text x="24" y="830" font-size="14" fill="#526575">Architecture illustration · not a security score</text></g></svg>
